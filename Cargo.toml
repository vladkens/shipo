[package]
name = "shipo"
version = "0.1.0"
edition = "2024"
description = "Releases and updates for desktop apps: a packer that makes a signed DMG, Windows setup, AppImage and .deb and a signed update feed on Linux, and a tiny updater that installs from it in place."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/shipo"
homepage = "https://github.com/vladkens/shipo"
documentation = "https://docs.rs/shipo"
readme = "readme.md"
keywords = ["updater", "auto-update", "installer", "dmg", "appimage"]
categories = ["development-tools::build-utils", "command-line-utilities"]
include = ["/src/**/*.rs", "/stubs/*.exe", "/stubs/SHA256SUMS", "/examples/update.rs", "/tests/fixtures/*", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/readme.md"]

[package.metadata.docs.rs]
no-default-features = true

[[bin]]
name = "shipo"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The packer, the `shipo` binary; an app takes the library alone with `default-features = false`.
cli = ["dep:flate2", "dep:getrandom", "dep:hmac-sha256", "dep:lexopt", "dep:plist", "dep:png", "dep:serde", "dep:tar", "dep:toml"]

[dependencies]
ed25519-compact = { version = "2.6.0", default-features = false }
flate2 = { version = "1.1.10", optional = true }
getrandom = { version = "0.4.3", optional = true }
hmac-sha256 = { version = "1.1.15", default-features = false, optional = true }
lexopt = { version = "0.3.2", optional = true }
plist = { version = "1.10", optional = true }
png = { version = "0.18.1", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSString", "NSURL", "NSURLSession", "NSURLRequest", "NSURLResponse", "NSError", "NSBundle", "NSDate", "NSValue"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "CSCommon", "SecCode", "SecStaticCode"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
