name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a dev release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
        env:
          PYTHONUTF8: 1 # the scripts read the sources as UTF-8 on Windows too
      - run: make test

  # The setup stub (setup/) for x64 and arm64 Windows, which the packer appends the app to; the
  # packer takes these by $SHIPO_SETUP_STUB_<ARCH>, a release's from shipo's `setup-v<N>` release.
  setup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: setup
          workspaces: setup
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: rustup target add aarch64-pc-windows-msvc
      - run: make setup
      - run: |
          mkdir stub
          cp setup/target/x86_64-pc-windows-msvc/release/shipo-setup.exe stub/shipo-setup-x64.exe
          cp setup/target/aarch64-pc-windows-msvc/release/shipo-setup.exe stub/shipo-setup-arm64.exe
          ls -l stub && sha256sum stub/*
      - uses: actions/upload-artifact@v7
        with:
          name: setup-stub
          path: stub/
          if-no-files-found: error

  # On Ubuntu with the tools apt has: the packer's ignored tests (the setup of the real stub, the
  # .deb and the AppImage read back, rcodesign fetched pinned, signing the Mac's binary), and the
  # DMGs and .debs each host packed, read by dmg2img and fsck.hfsplus (hfsprogs) and dpkg-deb.
  packages:
    needs: [setup, e2e-pack]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools desktop-file-utils hfsprogs dmg2img
      - uses: actions/download-artifact@v8
        with:
          name: setup-stub
          path: stub
      - uses: actions/download-artifact@v8
        with:
          name: e2e-bin-macOS
          path: macos
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-packed-*
          path: packed
      - run: cargo test -- --include-ignored
        env:
          SHIPO_TEST_MACHO: ${{ github.workspace }}/macos/1.0.0/aarch64-apple-darwin/hello
          SHIPO_SETUP_STUB_X64: ${{ github.workspace }}/stub/shipo-setup-x64.exe
      - run: |
          for dmg in packed/*/*/*.dmg; do
            dmg2img -i "$dmg" -o "${dmg%.dmg}.img"
            fsck.hfsplus -n "${dmg%.dmg}.img"
          done
          for deb in packed/*/*/*.deb; do dpkg-deb --info "$deb"; done

  # The end-to-end update (scripts/e2e-update.py): examples/update.rs at 1.0.0 and 2.0.0 built on
  # each OS, packed by shipo on each OS, 1.0.0 installed and updated in place from 2.0.0's feed
  # served on loopback, the packages of every packing host on Windows and Linux. The DMG updates
  # on the Mac that packed it: 1.0.0 takes only a 2.0.0 signed by its own identity, here "Hello
  # Local Signing", made by the script in a keychain codesign uses without a prompt.
  e2e-bin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run scripts/e2e-update.py build e2e
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-bin-${{ runner.os }}
          path: e2e/
          if-no-files-found: error

  e2e-pack:
    needs: [setup, e2e-bin]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-bin-*
          merge-multiple: true
          path: e2e
      - uses: actions/download-artifact@v8
        with:
          name: setup-stub
          path: stub
      - run: uv run scripts/e2e-update.py pack e2e
        env:
          SHIPO_SETUP_STUB_X64: ${{ github.workspace }}/stub/shipo-setup-x64.exe
          SHIPO_SETUP_STUB_ARM64: ${{ github.workspace }}/stub/shipo-setup-arm64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-packed-${{ runner.os }}
          path: |
            e2e/
            !e2e/target/
            !e2e/*.keychain-db
            !e2e/signing.*
          if-no-files-found: error
      - if: runner.os == 'macOS'
        run: uv run scripts/e2e-update.py run e2e

  e2e:
    needs: e2e-pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        packer: [Linux, macOS, Windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@v8
        with:
          name: e2e-packed-${{ matrix.packer }}
          path: e2e
      - run: uv run scripts/e2e-update.py run e2e

  # The DMGs packed off a Mac, signed ad hoc: read by hdiutil, the app run from the image.
  e2e-dmg:
    needs: e2e-pack
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-packed-*
          path: packed
      - run: |
          for dmg in packed/e2e-packed-{Linux,Windows}/*/*.dmg; do
            hdiutil verify -quiet "$dmg"
            hdiutil attach -nobrowse -readonly -mountpoint mnt "$dmg"
            codesign --verify --strict mnt/Hello.app
            test -x mnt/Hello.app/Contents/MacOS/hello
            echo "$dmg: $(mnt/Hello.app/Contents/MacOS/hello)"
            hdiutil detach mnt
          done

  # The shared release steps, as in wavo: `build` builds the packer's binaries read-only; on main
  # `publish` puts them up as the `dev` pre-release, and a `release: vX.Y.Z (#N)` commit publishes
  # the crate and the same archives as the version. `publish` never compiles.
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest # the macOS binary needs a Mac; Linux cross-compiles
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1
        with:
          targets: aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          dev: true

  publish:
    if: github.ref == 'refs/heads/main' # write rights only for main's own workflow
    needs: [test, packages, e2e, e2e-pack, e2e-dmg, build]
    runs-on: ubuntu-latest # no build here, and Linux runners start faster
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing and attestations
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
