name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a dev release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Each OS: the checks and the tests, those that fetch pinned tools too, and the test app of the
  # end-to-end update (examples/update.rs) built at 1.0.0 and 2.0.0 for `e2e`. On a Mac also the
  # setup stubs the packer embeds, stubs/, built again from source as `make setup` builds them
  # (scripts/setup-stub.py): the same bytes as stubs/SHA256SUMS, or the job fails. Only on a Mac:
  # Windows' and Linux's rustc lay the functions out in another order.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools desktop-file-utils
      - run: make check
        env:
          PYTHONUTF8: 1 # the scripts read the sources as UTF-8 on Windows too
      - run: make test
      # Linux has no Mach-O for rcodesign to sign: the Mac signs its own, and codesign verifies it.
      - run: cargo test -- --ignored ${{ runner.os == 'Linux' && '--skip rcodesign_signs' || '' }}
      - if: runner.os == 'macOS'
        run: cargo install cargo-xwin --locked --version 0.23.1 && uv run scripts/setup-stub.py --check
      - if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: setup-stub-built
          path: setup/target/bin/
      - run: uv run scripts/e2e-update.py build e2e
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-bin-${{ runner.os }}
          path: e2e/
          if-no-files-found: error

  # The end-to-end update (scripts/e2e-update.py): each OS packs every OS's packages of the test
  # app, then installs its own 1.0.0 and has it update itself in place from 2.0.0's feed served on
  # loopback. The DMG updates on the Mac that packed it: 1.0.0 takes only a 2.0.0 signed by its own
  # identity, here "Hello Local Signing", made by the script in a keychain codesign uses without a
  # prompt. The DMG is read back by the Mac's own tools and by Linux's, the .deb by dpkg-deb.
  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y hfsprogs dmg2img
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-bin-*
          merge-multiple: true
          path: e2e
      - run: uv run scripts/e2e-update.py pack e2e
      - if: runner.os == 'macOS'
        run: |
          for dmg in e2e/*/*.dmg; do
            hdiutil verify -quiet "$dmg"
            dev=$(hdiutil attach -nomount -readonly -noverify "$dmg" | awk '/^\/dev\// { print $1 }')
            fsck_hfs -n "$dev"
            hdiutil detach "$dev"
          done
      - if: runner.os == 'Linux'
        run: |
          for dmg in e2e/*/*.dmg; do
            img="$RUNNER_TEMP/$(basename "$dmg" .dmg).img"
            dmg2img -i "$dmg" -o "$img"
            fsck.hfsplus -n "$img"
          done
          for deb in e2e/*/*.deb; do dpkg-deb --info "$deb"; done
      - run: uv run scripts/e2e-update.py run e2e
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-sums-${{ runner.os }}
          path: e2e/SHA256SUMS
          if-no-files-found: error
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-dmg
          path: e2e/*/*.dmg
          if-no-files-found: error

  # Each package is the same bytes whichever host packed it, so the one an OS installed above is
  # the one every host packs. A Mac's DMG is its own, and so the feed that lists it: codesign signs
  # it by that Mac's keychain identity, which its update needs; Linux and Windows sign it ad hoc,
  # and that DMG opens on a Mac: hdiutil reads it, codesign verifies the app, the app runs.
  same:
    needs: e2e
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-sums-*
      - uses: actions/download-artifact@v8
        with:
          name: e2e-dmg
          path: dmg
      - run: |
          tail -n +1 e2e-sums-*/SHA256SUMS
          diff e2e-sums-Linux/SHA256SUMS e2e-sums-Windows/SHA256SUMS
          own() { grep -v -e '\.dmg$' -e ' update\.txt$' "$1"; }
          diff <(own e2e-sums-Linux/SHA256SUMS) <(own e2e-sums-macOS/SHA256SUMS)
      - run: |
          for dmg in dmg/*/*.dmg; do
            hdiutil verify -quiet "$dmg"
            hdiutil attach -nobrowse -readonly -mountpoint mnt "$dmg"
            codesign --verify --strict mnt/Hello.app
            echo "$dmg: $(mnt/Hello.app/Contents/MacOS/hello)"
            hdiutil detach mnt
          done

  # The shared release steps, as in wavo: `build` builds the packer's binaries read-only; on main
  # `publish` puts them up as the `dev` pre-release, and a `release: vX.Y.Z (#N)` commit publishes
  # the crate and the same archives as the version. `publish` never compiles.
  build:
    if: "github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'release: v')"
    runs-on: macos-latest # the macOS binary needs a Mac; Linux and Windows cross-compile
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1
        with:
          targets: aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu
          dev: true

  publish:
    if: github.ref == 'refs/heads/main' # write rights only for main's own workflow
    needs: [test, e2e, same, build]
    runs-on: ubuntu-latest # no build here, and Linux runners start faster
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing and attestations
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
