name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a dev release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # checks, tests, and the e2e app
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools desktop-file-utils
      - run: make check
        env:
          PYTHONUTF8: 1 # the scripts read the sources as UTF-8 on Windows too
      - run: make test
      # Linux has no Mach-O to sign; the Mac runs that one
      - run: cargo test -- --ignored ${{ runner.os == 'Linux' && '--skip rcodesign_signs' || '' }}
      - run: uv run scripts/e2e-update.py build e2e
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-bin-${{ runner.os }}
          path: e2e/
          if-no-files-found: error

  # the setup stubs the packer embeds, rebuilt from source to the same bytes
  setup:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-xwin@0.23.1
      - run: uv run scripts/setup-stub.py --check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: setup-stub-built
          path: setup/target/bin/

  # each OS packs every OS's packages, then updates its own from 1.0.0 to 2.0.0
  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y hfsprogs dmg2img
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-bin-*
          merge-multiple: true
          path: e2e
      - run: uv run scripts/e2e-update.py pack e2e
      # attach retries as the library does: DiskImages can be busy for a moment
      - if: runner.os == 'macOS'
        run: |
          attach() { for _ in 1 2 3 4 5; do hdiutil attach "$@" && return; sleep 1; done; return 1; }
          for dmg in e2e/*/*.dmg; do
            hdiutil verify -quiet "$dmg"
            dev=$(attach -nomount -readonly -noverify "$dmg" | awk '/^\/dev\// { print $1 }')
            fsck_hfs -n "$dev"
            hdiutil detach "$dev"
          done
      - if: runner.os == 'Linux'
        run: |
          for dmg in e2e/*/*.dmg; do
            img="$RUNNER_TEMP/$(basename "$dmg" .dmg).img"
            dmg2img -i "$dmg" -o "$img"
            fsck.hfsplus -n "$img"
          done
          for deb in e2e/*/*.deb; do dpkg-deb --info "$deb"; done
      - run: uv run scripts/e2e-update.py run e2e
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-sums-${{ runner.os }}
          path: e2e/SHA256SUMS
          if-no-files-found: error
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-dmg
          path: e2e/*/*.dmg
          if-no-files-found: error

  # every host packs the same bytes (a Mac signs its DMG with its own identity)
  same:
    needs: e2e
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-sums-*
      - uses: actions/download-artifact@v8
        with:
          name: e2e-dmg
          path: dmg
      - run: |
          tail -n +1 e2e-sums-*/SHA256SUMS
          diff e2e-sums-Linux/SHA256SUMS e2e-sums-Windows/SHA256SUMS
          own() { grep -v -e '\.dmg$' -e ' update\.txt$' "$1"; }
          diff <(own e2e-sums-Linux/SHA256SUMS) <(own e2e-sums-macOS/SHA256SUMS)
      # the ad-hoc DMG of Linux and Windows opens and runs on a Mac
      - run: |
          attach() { for _ in 1 2 3 4 5; do hdiutil attach "$@" && return; sleep 1; done; return 1; }
          for dmg in dmg/*/*.dmg; do
            hdiutil verify -quiet "$dmg"
            attach -nobrowse -readonly -mountpoint mnt "$dmg"
            codesign --verify --strict mnt/Hello.app
            echo "$dmg: $(mnt/Hello.app/Contents/MacOS/hello)"
            hdiutil detach mnt
          done

  # the shared release steps, as in wavo: `build` read-only, `publish` never compiles
  build:
    if: "github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'release: v')"
    runs-on: macos-latest # the macOS binary needs a Mac; Linux and Windows cross-compile
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1
        with:
          targets: aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu
          dev: true

  publish:
    if: github.ref == 'refs/heads/main' # write rights only for main's own workflow
    needs: [test, setup, e2e, same, build]
    runs-on: ubuntu-latest # no build here, and Linux runners start faster
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing and attestations
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
