[package]
name = "shipo-cli"
version = "0.0.1"
edition = "2024"
description = "Packs a desktop app's binaries into signed installers and a signed update feed, on Linux."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/shipo"

[[bin]]
name = "shipo"
path = "src/main.rs"

[dependencies]
ed25519-compact = { version = "2.6.0", default-features = false }
flate2 = "1.1.10"
hmac-sha256 = { version = "1.1.15", default-features = false }
lexopt = "0.3.2"
png = { version = "0.18.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
shipo = { path = ".." }
