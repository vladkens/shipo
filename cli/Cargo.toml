[package]
name = "shipo-cli"
version = "0.0.1"
edition = "2024"
description = "Packs a desktop app's binaries into signed installers and a signed update feed, on Linux."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/shipo"

[[bin]]
name = "shipo"
path = "src/main.rs"

[dependencies]
lexopt = "0.3.2"
png = { version = "0.18.1", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
