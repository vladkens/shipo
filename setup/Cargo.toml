[package]
name = "shipo-setup"
version = "0.0.0"
edition = "2024"
description = "The Windows setup stub that shipo's packer appends an app to."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/shipo"
publish = false

[dependencies]
flate2 = "1.1.10"

# Small, as each setup carries it.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
