[package]
name = "shipo-nimbo"
version = "0.1.0"
edition = "2024"
publish = false
# The .deb's Maintainer.
authors = ["Me <me@example.com>"]
# Where `shipo release --tag` links the feed's files: your app's repository.
repository = "https://github.com/me/hello"

[dependencies]
nimbo = { git = "https://github.com/vladkens/nimbo", branch = "main" }
shipo = { path = "../..", default-features = false }

[package.metadata.shipo]
id = "dev.shipo.example.nimbo"
name = "ShipoNimbo"
icon = "icon.png"
comment = "Updates itself from a shipo feed"
